<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Celebration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff0080,#7928ca,#00c6ff);
    overflow:hidden;
    color:white;
    text-align:center;
}

/* Floating Balloons */

.balloon{
    position:absolute;
    bottom:-100px;
    font-size:40px;
    animation:float 10s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    100%{
        transform:translateY(-120vh);
    }
}

/* LOGIN PAGE */

#loginPage{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:350px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.login-box h1{
    font-size:40px;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

.login-box button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#ff1493;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.login-box button:hover{
    transform:scale(1.05);
}

/* MAIN PAGE */

#mainPage{
    display:none;
    padding:30px;
}

.title{
    font-size:70px;
    margin-top:20px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

.message{
    font-size:24px;
    margin-top:20px;
    line-height:1.6;
}

/* PHOTO */

.photo{
    width:320px;
    border-radius:25px;
    margin-top:30px;
    box-shadow:0 0 25px rgba(255,255,255,0.6);
}

/* CAKE */

.cake-section{
    margin-top:40px;
}

.cake{
    font-size:180px;
    animation:shake 2s infinite alternate;
}

@keyframes shake{
    from{
        transform:rotate(-5deg);
    }
    to{
        transform:rotate(5deg);
    }
}

.cut-btn{
    margin-top:20px;
    padding:15px 35px;
    border:none;
    border-radius:15px;
    background:#ff1493;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
}

.cut-btn:hover{
    transform:scale(1.05);
}

/* CELEBRATION */

#celebration{
    display:none;
    margin-top:40px;
    animation:zoom 1s infinite alternate;
}

@keyframes zoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

.celebrate-text{
    font-size:50px;
    margin-top:20px;
}

/* CARDS */

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:50px;
}

.card{
    width:250px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
}

.card h2{
    margin-top:15px;
}

/* FOOTER */

footer{
    margin-top:50px;
    padding:20px;
    font-size:18px;
}

</style>
</head>

<body>

<!-- Floating Emojis -->

<div class="balloon" style="left:5%;animation-duration:8s;">🎈</div>
<div class="balloon" style="left:20%;animation-duration:10s;">🎉</div>
<div class="balloon" style="left:40%;animation-duration:7s;">🎂</div>
<div class="balloon" style="left:60%;animation-duration:9s;">🎁</div>
<div class="balloon" style="left:80%;animation-duration:11s;">✨</div>

<!-- LOGIN PAGE -->

<section id="loginPage">

<div class="login-box">

<h1>🎂 Birthday Login</h1>

<input type="text" id="name" placeholder="Enter Name">

<input type="password" placeholder="Password">

<button onclick="openBirthday()">
Enter Celebration 🎉
</button>

</div>

</section>

<!-- MAIN PAGE -->

<section id="mainPage">

<h1 class="title">🎉 Happy Birthday 🎉</h1>

<p class="message" id="wishMessage">
Wishing you happiness and success forever 💖
</p>

<!-- PHOTO -->

<img
src="SISTER.jpeg"
class="photo"
alt="Birthday Photo"
>

<!-- SONG -->

<div style="margin-top:40px;">

<h2 style="font-size:40px;">🎵 Birthday Song 🎵</h2>

<br>

<audio id="song" controls autoplay>

<source src="birthday.mp3" type="audio/mpeg">

</audio>

</div>

<!-- CAKE SECTION -->

<div class="cake-section">

<div class="cake" id="cake">
🎂
</div>

<button class="cut-btn" onclick="cutCake()">
Cut Cake 🎂
</button>

</div>

<!-- CELEBRATION -->

<div id="celebration">

<div class="celebrate-text">
🎊 Celebration Time 🎊
</div>

<h1 style="font-size:80px;">
🎉 🎉 🎉
</h1>

</div>

<!-- CARDS -->

<div class="cards">

<div class="card">

<div style="font-size:60px;">🎁</div>

<h2>Gift Time</h2>

<p>Lots of gifts and happiness.</p>

</div>

<div class="card">

<div style="font-size:60px;">💖</div>

<h2>Love</h2>

<p>Beautiful memories forever.</p>

</div>

<div class="card">

<div style="font-size:60px;">🎉</div>

<h2>Party</h2>

<p>Dance and enjoy the celebration.</p>

</div>

</div>

<footer>
Made with ❤️ for My Sister
</footer>

</section>

<script>

/* LOGIN */

function openBirthday(){

let username=document.getElementById("name").value;

if(username.trim()==""){

alert("Please Enter Your Name");

return;

}

document.getElementById("loginPage").style.display="none";

document.getElementById("mainPage").style.display="block";

document.getElementById("wishMessage").innerHTML=
"Happy Birthday <b>"+username+"</b> 🎂💖<br><br>May your life always shine with happiness and love ✨";

}

/* CAKE CUT */

function cutCake(){

let cake=document.getElementById("cake");

cake.innerHTML="🍰";

cake.style.transform="scale(1.2)";

document.getElementById("celebration").style.display="block";

startConfetti();

}

/* CONFETTI */

function startConfetti(){

setInterval(()=>{

let confetti=document.createElement("div");

confetti.innerHTML="🎉";

confetti.style.position="fixed";

confetti.style.left=Math.random()*100+"vw";

confetti.style.top="-20px";

confetti.style.fontSize="35px";

document.body.appendChild(confetti);

let fall=setInterval(()=>{

confetti.style.top=parseInt(confetti.style.top)+5+"px";

if(parseInt(confetti.style.top)>window.innerHeight){

clearInterval(fall);

confetti.remove();

}

},30);

},300);

}

</script>

</body>
</html>
